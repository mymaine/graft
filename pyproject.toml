[project]
name = "graft"
version = "0.0.0"
description = "Self-editing HTTP API harness for AI agents — agent writes and revises its own helpers, git is the memory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "maine" }]
keywords = ["agent", "harness", "llm", "claude-code", "self-editing", "http"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.scripts]
graft = "graft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pre-commit>=4.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/graft"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "RUF", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# do_GET / do_POST are stdlib BaseHTTPRequestHandler API; ruff older versions
# flag N802 (function name not lowercase). pyproject keeps both ruff versions consistent.
"src/graft/daemon.py" = ["N802"]
"tests/unit/test_loader.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
